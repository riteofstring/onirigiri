name: Dependency security

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Weekly online supply-chain scan
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up the pinned Node toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version

      - name: Install the pinned package manager
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts pnpm@10.23.0
          test "$(pnpm --version)" = "10.23.0"

      - name: Install the locked Code Polishy release
        run: ./code-polishyw setup

      - name: Install frozen dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run online dependency security scan
        run: ./code-polishyw supply-chain
